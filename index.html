<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1><span class="rock-h1">ROCK </span><span class="paper-h1">PAPER</span><span class="scissors-h1"> SCISSORS </span><span class="shoot-h1">SHOOT!</span></h1>
    <div class="buttons">
        <button class="rock-bttn"><!--<img src="images/rock.png" alt="rock">--></button>
        <button class="paper-bttn"><!--<img src="images/paper.png" alt="paper">--></button>
        <button class="scissors-bttn"><!--<img src="images/scissors.png" alt="scissors">--></button>
    </div>
    <div class="stats"> 
        <div class="my-choice">
            <h2>Your choice</h2>
            <img class="my-choice-img" src="images/fist.png" alt="fist">
        </div>
        <div class="score">
            <h3 class="first-five">First to five!</h3>
            <h2><span class="my-score">0</span>  <span class="computer-score">0</span></h2>
            <p class="status">--</p>
        </div>
        <div class="computer-choice">
            <h2>computer-choice</h2>
            <img class="computer-choice-img" src="images/fist.png" alt="fist">
        </div>
    </div>
    <script src="main.js">
    </script>
</body>
</html>
